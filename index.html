<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cấu tạo của Protein – Mô phỏng 3D</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#475569;--ac:#2563eb;--bd:#cbd5e1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--tx:#e2e8f0;--mu:#94a3b8;--ac:#60a5fa;--bd:#263349}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--tx:#e2e8f0;--mu:#94a3b8;--ac:#60a5fa;--bd:#263349}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Roboto,sans-serif}
h1{font-size:1.25rem;margin:0;padding:14px 16px 0}
.app{display:flex;gap:14px;padding:14px 16px;flex-wrap:wrap}
.panel{flex:1 1 320px;max-width:460px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.view{flex:2 1 380px;position:relative;min-height:440px;height:70vh;background:#0f172a;border-radius:14px;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-size:13px;font-weight:600;padding:3px 8px;border-radius:8px;background:rgba(15,23,42,.85);border:1px solid currentColor}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button,.ctl button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:999px;padding:6px 12px}
.tabs button.on,.ctl button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
h2{font-size:1.1rem;margin:0 0 8px}
p,li{line-height:1.55;color:var(--mu);font-size:.95rem}
ul{padding-left:18px;margin:6px 0}
b{color:var(--tx)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.chip{font-size:11px;font-weight:700;color:#0f172a;padding:3px 6px;border-radius:6px}
.hint{font-size:.8rem;color:var(--mu);margin-top:10px}
</style>
</head>
<body>
<h1>🧬 Cấu tạo của Protein – Mô phỏng 3D</h1>
<div class="app">
  <div class="panel"><div class="tabs" id="tabs"></div><div id="info"></div></div>
  <div class="view" id="view"><div id="labels"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const NAMES=["Gly","Ala","Val","Leu","Ile","Pro","Phe","Trp","Met","Cys","Ser","Thr","Tyr","Asn","Gln","Asp","Glu","Lys","Arg","His"];
const COL=NAMES.map((_,i)=>new THREE.Color().setHSL(i/20,.75,.6));
const hex=i=>"#"+COL[i].getHexString();
const EL={C:[0x9aa4b2,.55],H:[0xffffff,.32],O:[0xef4444,.5],N:[0x3b82f6,.52],S:[0xfacc15,.6]};
const view=document.getElementById('view'),labels=document.getElementById('labels');
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,.1,100);camera.position.z=15;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
view.prepend(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,.6));const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(5,8,10);scene.add(dl);
let g=new THREE.Group();scene.add(g);let L=[],anims=[];
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
let drag=false,px=0,py=0;
view.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag)return;g.rotation.y+=(e.clientX-px)*.01;g.rotation.x+=(e.clientY-py)*.01;px=e.clientX;py=e.clientY});

function sph(parent,color,r,x,y,z){const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,18),new THREE.MeshPhongMaterial({color,shininess:60}));m.position.set(x,y,z);parent.add(m);return m}
function atom(parent,el,x,y,z){return sph(parent,EL[el][0],EL[el][1],x,y,z)}
function bond(parent,a,b,color=0xcbd5e1,r=.09){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A);
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),8),new THREE.MeshPhongMaterial({color}));
 m.position.copy(A.clone().add(B).multiplyScalar(.5));m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());parent.add(m);return m}
function label(text,parent,x,y,z,color="#fff"){const o=new THREE.Object3D();o.position.set(x,y,z);parent.add(o);
 const el=document.createElement('div');el.className='lb';el.style.color=color;el.innerHTML=text;labels.appendChild(el);const l={el,o};L.push(l);return l}
function clear(){scene.remove(g);g=new THREE.Group();scene.add(g);labels.innerHTML='';L=[];anims=[]}
function move(o,x,y,z){anims.push({o,t:new THREE.Vector3(x,y,z)})}

/* Amino acid */
function aa(parent,x,rcol,lab){
 const a=new THREE.Group();a.position.x=x;parent.add(a);
 const ca=atom(a,'C',0,0,0),N=atom(a,'N',-1.5,.7,0),C=atom(a,'C',1.5,.7,0);
 atom(a,'O',2.1,1.8,0);atom(a,'H',0,-.3,1.2);
 bond(a,[0,0,0],[-1.5,.7,0]);bond(a,[0,0,0],[1.5,.7,0]);bond(a,[0,0,0],[0,-.3,1.2]);
 bond(a,[1.5,.7,0],[2.1,1.8,-.07]);bond(a,[1.5,.7,0],[2.1,1.8,.07]);
 const R=sph(a,rcol,.85,0,-1.1,-1.5);bond(a,[0,0,0],[0,-1.1,-1.5],0xf59e0b,.12);
 const hG=new THREE.Group();a.add(hG);atom(hG,'H',-2.3,.6,-.8);bond(hG,[-1.5,.7,0],[-2.3,.6,-.8]);
 const h1=new THREE.Group();a.add(h1);atom(h1,'H',-2.2,1.7,.4);bond(h1,[-1.5,.7,0],[-2.2,1.7,.4]);
 const oG=new THREE.Group();a.add(oG);atom(oG,'O',2.2,-.4,0);atom(oG,'H',3.1,-.3,.3);
 bond(oG,[1.5,.7,0],[2.2,-.4,0]);bond(oG,[2.2,-.4,0],[3.1,-.3,.3]);
 if(lab){label("Nhóm amino –NH₂",a,-2.4,1.5,0,"#60a5fa");label("Nhóm carboxyl –COOH",a,2.6,.9,0,"#f87171");
  label("Gốc R (quyết định tính chất)",a,0,-2.3,-1.5,"#fbbf24");label("Cα",a,-.3,.5,.6,"#e2e8f0")}
 return{a,hG,oG,N,C}
}

/* Chuỗi polypeptide */
function chain(seq){
 let A=0,B=0,p=new THREE.Vector3(),pts=[p.clone()];
 seq.forEach(i=>{A+=.6+(i%7)*.25;B+=.3+(i%4)*.3;p.add(new THREE.Vector3(Math.cos(A)*Math.cos(B),Math.sin(B),Math.sin(A)*Math.cos(B)).multiplyScalar(1.4));pts.push(p.clone())});
 const c=pts.reduce((s,v)=>s.add(v),new THREE.Vector3()).divideScalar(pts.length);pts.forEach(v=>v.sub(c));
 for(let k=0;k<seq.length;k++){sph(g,COL[seq[k]],.6,pts[k].x,pts[k].y,pts[k].z);
  bond(g,pts[k].toArray(),pts[k+1].toArray(),0xe2e8f0,.12)}
 const l=pts[seq.length];sph(g,COL[seq[seq.length-1]],.6,l.x,l.y,l.z);
 let m=0;pts.forEach(v=>m=Math.max(m,v.length()));camera.position.z=Math.max(11,m*2.6+3)
}
const chips=s=>'<div class="chips">'+s.map(i=>`<span class="chip" style="background:${hex(i)}">${NAMES[i]}</span>`).join('')+'</div>';

/* Các bước */
let seq5=[0,3,7,12,5,9,14,18];
function build(n){
 clear();camera.position.z=15;const I=document.getElementById('info');
 if(n==0){chain([...Array(20).keys()]);
  I.innerHTML=`<h2>1. Nguyên tắc đa phân</h2><p>Protein là <b>đại phân tử</b> gồm nhiều <b>đơn phân</b> giống nhau về cấu trúc liên kết thành chuỗi.</p><ul><li>Đơn phân của protein là <b>amino acid</b>.</li><li>Có khoảng <b>20 loại</b> amino acid chính (mỗi màu là một loại).</li></ul>${chips([...Array(20).keys()])}<p class="hint">Kéo chuột để xoay mô hình.</p>`}
 if(n==1){const d=[['C','Carbon'],['H','Hydrogen'],['O','Oxygen'],['N','Nitrogen'],['S','Sulfur']];
  d.forEach((e,i)=>{const t=i/5*Math.PI*2,x=Math.cos(t)*4.2,y=Math.sin(t)*4.2,m=atom(g,e[0],x,y,0);m.scale.setScalar(2.2);label(`${e[0]} – ${e[1]}`,g,x,y-1.7,0,'#'+EL[e[0]][0].toString(16).padStart(6,'0'))});
  I.innerHTML=`<h2>2. Thành phần hóa học</h2><p>Protein được cấu tạo từ các nguyên tố:</p><ul><li><b>C, H, O, N</b> – có trong mọi protein.</li><li><b>S</b> (lưu huỳnh) – có thêm ở một số loại protein.</li></ul>`}
 if(n==2){aa(g,-.5,0xf59e0b,true);g.position.x=-.2;camera.position.z=13;
  I.innerHTML=`<h2>3. Cấu tạo amino acid</h2><p>Mỗi amino acid gồm một nguyên tử <b>Cα</b> trung tâm gắn với:</p><ul><li><b>Nhóm amino</b> (–NH₂) <span style="color:#3b82f6">●</span></li><li><b>Nhóm carboxyl</b> (–COOH)</li><li><b>Gốc R</b> (mạch bên): quyết định <b>tính chất riêng</b> của từng loại amino acid.</li></ul><p class="hint">Cầu: xám = C, trắng = H, đỏ = O, xanh = N.</p>`}
 if(n==3){const a1=aa(g,-2.6,0xf59e0b,false),a2=aa(g,5,0x22c55e,false);camera.position.z=16;
  label("Amino acid 1",a1.a,0,2.6,0,"#fbbf24");label("Amino acid 2",a2.a,0,2.6,0,"#4ade80");
  const pb=bond(g,[-1.1,.7,0],[.5,.7,0],0xfb923c,.22);pb.visible=false;const pl=label("Liên kết peptide (C–N)",g,-.3,1.6,0,"#fb923c");pl.el.style.display='none';
  const wl=label("H₂O",g,.8,-3.6,0,"#38bdf8");wl.el.style.display='none';
  window.react=()=>{move(a2.a,2,0,0);move(a1.oG,1.2,-3.5,0);move(a2.hG,1.9,-4,.8);
   setTimeout(()=>{pb.visible=true;pl.el.style.display='';wl.el.style.display='';},1300)};
  window.rebuild=()=>build(3);
  I.innerHTML=`<h2>4. Liên kết peptide</h2><p>Nhóm –COOH của amino acid này kết hợp với nhóm –NH₂ của amino acid kế tiếp, <b>giải phóng 1 phân tử H₂O</b>, tạo <b>liên kết peptide</b> (C–N).</p><p>Nhiều amino acid nối nhau → <b>chuỗi polypeptide</b>.</p><div class="ctl"><button class="pri" onclick="react()">▶ Tạo liên kết</button><button onclick="rebuild()">↺ Đặt lại</button></div>`}
 if(n==4){chain(seq5);const n5=seq5.length;
  I.innerHTML=`<h2>5. Tính đa dạng và đặc thù</h2><p>Số lượng, thành phần và <b>trình tự</b> amino acid quyết định cấu trúc → chức năng của mỗi protein. Hãy thử thay đổi:</p>${chips(seq5)}<div class="ctl"><button onclick="ch(0)">Đổi số lượng</button><button onclick="ch(1)">Đổi thành phần</button><button onclick="ch(2)">Đổi trình tự</button><button onclick="ch(3)">↺ Đặt lại</button></div><p>Chuỗi dài <b>${n5}</b> amino acid có thể tạo tới khoảng <b>20<sup>${n5}</sup> ≈ ${Math.pow(20,n5).toExponential(1)}</b> chuỗi khác nhau!</p>`}
}
const r=n=>Math.floor(Math.random()*n);
window.ch=k=>{if(k==0){seq5=Math.random()<.5&&seq5.length>4?seq5.slice(0,-2):[...seq5,r(20),r(20)]}
 if(k==1){const i=r(seq5.length);let v;do v=r(20);while(v==seq5[i]);seq5=seq5.slice();seq5[i]=v}
 if(k==2){seq5=seq5.slice().sort(()=>Math.random()-.5)}
 if(k==3)seq5=[0,3,7,12,5,9,14,18];build(4)};
const T=["1. Đa phân","2. Nguyên tố","3. Amino acid","4. Liên kết peptide","5. Đa dạng"],tb=document.getElementById('tabs');
T.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{[...tb.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');build(i)};tb.appendChild(b)});
tb.children[0].classList.add('on');
const v=new THREE.Vector3();
function loop(){requestAnimationFrame(loop);if(!drag)g.rotation.y+=.004;
 anims.forEach(a=>a.o.position.lerp(a.t,.05));
 L.forEach(l=>{l.o.getWorldPosition(v);v.project(camera);l.el.style.transform=`translate(${(v.x*.5+.5)*view.clientWidth}px,${(-v.y*.5+.5)*view.clientHeight}px) translate(-50%,-50%)`});
 renderer.render(scene,camera)}
resize();build(0);loop();
</script>
</body>
</html>
